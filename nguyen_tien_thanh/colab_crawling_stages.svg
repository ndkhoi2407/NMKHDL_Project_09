<svg xmlns="http://www.w3.org/2000/svg" width="850" height="360" viewBox="0 0 850 360" role="img" aria-labelledby="title desc">
<title id="title">Student-reported Colab crawling benchmark: crawling stages</title>
<desc id="desc">Stage durations in hours for 5,000 papers. Metadata accounts for 71.9 percent of reported crawling time. Clean is 2.71 seconds.</desc>
<rect width="850" height="360" fill="white"/>
<g font-family="sans-serif" font-size="14" fill="#182230">
<text x="24" y="30" font-size="20">Student-reported Colab crawling benchmark</text>
<text x="24" y="55">Google Colab CPU - 5,000 publications - crawling stages</text>
<text x="24" y="108">Discovery</text>
<rect x="140" y="90" width="1.577" height="27" fill="#286ba6"/>
<text x="151.577" y="108">0.0546 h (196.50 s)</text>
<text x="24" y="151">Download</text>
<rect x="140" y="133" width="168.084" height="27" fill="#286ba6"/>
<text x="318.084" y="151">5.8183 h (20,945.87 s)</text>
<text x="24" y="194">Clean</text>
<rect x="140" y="176" width="0.800" height="27" fill="#286ba6"/>
<text x="150.022" y="194">0.0008 h (2.71 s)</text>
<text x="24" y="237">Metadata</text>
<rect x="140" y="219" width="512.429" height="27" fill="#c24720"/>
<text x="662.429" y="237">17.7379 h (63,856.52 s)</text>
<text x="24" y="280">References</text>
<rect x="140" y="262" width="30.426" height="27" fill="#286ba6"/>
<text x="180.426" y="280">1.0532 h (3,791.50 s)</text>
<text x="140" y="335">Duration (hours); bar lengths use a linear scale</text>
</g></svg>