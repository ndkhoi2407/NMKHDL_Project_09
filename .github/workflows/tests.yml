name: Offline pipeline checks
on:
  push:
    branches: ['24127121']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: python -m pip install -r src/requirements.txt
      - name: Run offline regression tests
        run: |
          python scripts/check_parser_logic.py
          python scripts/check_pipeline.py
          python scripts/check_colab_workflow.py
